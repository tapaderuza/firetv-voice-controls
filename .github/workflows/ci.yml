name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and builds
        run: ./gradlew :voicecontrols:testDebugUnitTest :voicecontrols:lintRelease :voicecontrols:assembleRelease :sample:lintDebug :sample:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
